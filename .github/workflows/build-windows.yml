name: Windows

on:
  push:
    tags:
      - "v*.*.*"
    branches: [ windows-workflow, build-all ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DBUILD_VIEWER=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Upload viewer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/viewer/RelWithDebInfo/viewer.exe
