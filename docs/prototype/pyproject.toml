[project]
name = "mmd-demo"
version = "0.1.0"
description = "A PMX model viewer with outline rendering support"
requires-python = ">=3.10"
dependencies = [
    "glfw>=2.10.0",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
    "pymeshio>=3.0.1",
    "pyopengl>=3.1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
package-dir = "src"
