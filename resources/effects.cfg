# Swappable — T key toggles between these
[base]
vert = main.vert
frag = base.frag

[toon]
vert = main.vert
frag = toon.frag

# Built-in — rendering infrastructure, not swappable
[outline]
vert = outline.vert
frag = outline.frag

[shadow]
vert = shadow_depth.vert
frag = shadow_depth.frag

[ground]
vert = ground.vert
frag = ground.frag

[rigidbody]
vert = rigidbody.vert
frag = rigidbody.frag
